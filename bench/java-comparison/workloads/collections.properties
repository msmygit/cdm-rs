# cdm-rs tier-3 workload "collections" — NFR-004, TST-060.
#
# ONE file, BOTH implementations:
#   spark-submit --properties-file collections.properties --class com.datastax.cdm.job.Migrate cdm.jar
#   cdm migrate   --properties-file collections.properties --config cdm-rs-pins.properties
#
# Connection settings are deliberately absent. The harness appends them as `--conf` arguments to
# both commands, so that the file which decides how much work is done is identical, byte for byte,
# for both implementations and can be published alongside the result.
#
# Everything below the "shared" banner is character-identical in narrow.properties,
# wide.properties and collections.properties. `diff` them; that is the point.
#
# Every value is pinned. None is left to a default, including the ones where the two
# implementations agree on the default (`docs/generated/PROPERTIES.md` against Java's
# `KnownProperties.java`), because a default that changes in either project between now and the
# next run would silently change what was measured. See ../METHODOLOGY.md §3.

spark.cdm.schema.origin.keyspaceTable             origin.sensor_data
spark.cdm.schema.target.keyspaceTable             target.sensor_data

# DEFAULT_ROWS = ~999,996 (collections.nb5.yaml `load-cycles` of 1,000,000, less the clustering-key
# collisions upstream also saw). numParts follows the rule numParts = DEFAULT_ROWS / 2000, so a
# range holds ~2,000 rows on every workload. If the harness changes the row count it MUST override
# this with `--conf spark.cdm.perfops.numParts=<rows/2000>` on both commands; the rule, not the
# number, is what is pinned. ../METHODOLOGY.md §2.4.
#
# What the ring split actually divides here is 10,000 device_id partitions, so a range is ~20 whole
# partitions rather than thousands of single-row ones, and both implementations read them
# sequentially. numParts is NOT left at the shared default of 5,000: at 5,000 parts a range would
# hold two partitions and most of the run would be range setup. See ../METHODOLOGY.md §4.3.
spark.cdm.perfops.numParts                        500

# ------------------------------------------------------------------------------------ shared ---

# 1, not the shared default of 5. At batchSize 1 both implementations issue exactly one INSERT per
# row and MIG-022 (cdm-rs groups a batch by partition key, Java by read order) cannot express
# itself. Configuration B in ../METHODOLOGY.md §4.2 measures batchSize 5 separately, with cdm-rs
# put into `perfops.batch_grouping = legacy` so the grouping algorithm matches.
spark.cdm.perfops.batchSize                       1
spark.cdm.perfops.fetchSizeInRows                 1000

# Implemented by cdm-rs (ENG-009) and absent from Java's KnownProperties, so Java ignores it.
# 0 is unlimited, which is cdm-rs's default and Java's only behaviour: the two agree, and any
# other value would abort one implementation and not the other.
spark.cdm.perfops.errorLimit                      0

# 1,000,000 rows/s, fifty times the shared default of 20,000.
#
# The limiter almost certainly does NOT bind on this hardware, and this pin is not a claim that it
# does. cdm-rs's own tier-2 macro-benchmark measured 9,509 rows/s for 100,000 rows of a 16-column
# table with both Cassandra containers and the tool on one Apple M-series laptop — a faster machine
# than a free four-vCPU runner, and less than half the default ceiling. Java, at roughly half
# cdm-rs's rate on a slower box, sits further below it still.
#
# It is pinned anyway because it costs nothing when it never binds and voids the whole result when
# it does, and because a ceiling that bound would be invisible in the output: both tools would
# simply report the same number and the ratio would read 1.0. What turns that from an assumption
# into a measurement is the void condition — the run is discarded if either implementation's
# observed rate comes within 20% of this ceiling. ../METHODOLOGY.md §4.1.
#
# 100_000 and not something larger, which is a measured result rather than a preference. This
# limiter is also the ONLY backpressure in Java CDM's write path. Raised to 1_000_000 while
# standing the environment up, the same job reported `Final Error Record Count: 135264` and lost
# 24_409 rows to `NodeUnavailableException` — it does not slow down when the target stops keeping
# up, it fails writes. 100_000 sits far above anything this hardware reaches (the environment
# smoke test measured ~22_000 rows/s steady state on a twelve-core laptop) while leaving that
# backpressure intact. See ../README-ENVIRONMENT.md.
#
# The loss would not have been mistaken for throughput — `run.sh` cross-checks the job's write
# counter against an independent `SELECT COUNT(*)` and marks a short target `unverified` — but an
# unverified run is three hours spent to produce no number at all.
spark.cdm.perfops.ratelimit.origin                100000
spark.cdm.perfops.ratelimit.target                100000

# RF=1, so LOCAL_QUORUM is one replica on both sides. Pinned anyway: it is the shared default and
# an unpinned consistency level is the single easiest way to accidentally measure two different
# amounts of work.
spark.cdm.perfops.consistency.read                LOCAL_QUORUM
spark.cdm.perfops.consistency.write               LOCAL_QUORUM

# TTL and writetime propagation stays ON, at the shared default. It is what Java CDM does out of
# the box, it is what a real migration does, and it is a large part of the per-column cost this
# suite is trying to see. Turning it off would make the wide workload measure nothing in
# particular.
spark.cdm.schema.origin.column.ttl.automatic      true
spark.cdm.schema.origin.column.writetime.automatic true
spark.cdm.schema.ttlwritetime.calc.useCollections false

# Nothing repairs anything. Autocorrect turns validate into a write job on one side only if the two
# runs disagree, which would make the second measurement depend on the first.
spark.cdm.autocorrect.missing                     false
spark.cdm.autocorrect.mismatch                    false
spark.cdm.autocorrect.missing.counter             false

# No run tracking. Both implementations write one row per token range to cdm_run_details when this
# is on; that is real, matched work, but it also makes the target keyspace's write volume depend on
# numParts and it is not what NFR-004 is about.
spark.cdm.trackRun                                false

# No transformation. Every one of these would change the number of bytes written.
spark.cdm.transform.custom.ttl                    0
spark.cdm.transform.custom.writetime              0
spark.cdm.transform.custom.writetime.incrementBy  0
spark.cdm.transform.map.remove.null.value         false

# 100 is the value a full run uses, and it is also the suite's calibration knob. The pilot in
# ../METHODOLOGY.md §2.4 measures the runner's actual rate and lowers this — identically on both
# implementations — until a Java run lasts ~350 s. That is how the suite absorbs a runner slower
# than the estimate without reloading data, and it is the reason the loaded row counts are sized
# for the optimistic case. Both implementations shrink each range the same way (TOK-005 reproduces
# Java's SplitPartitions), and tier 1 measured coverage sampling as free at plan time. Whatever
# value is used must be identical on both sides and recorded with the result.
spark.cdm.filter.java.token.percent               100

# No guardrail, no JSON extraction. cdm-rs implements the guardrail inline (GRD-004) where Java has
# it only as a separate job, so a non-zero colSizeInKB would be per-row work on one side only.
spark.cdm.feature.guardrail.colSizeInKB           0
spark.cdm.feature.extractJson.exclusive           false
spark.cdm.feature.extractJson.overwrite           false
