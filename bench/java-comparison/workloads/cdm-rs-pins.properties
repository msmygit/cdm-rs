# Every cdm-rs setting that has no Java CDM equivalent — NFR-004, TST-060.
#
#   cdm migrate --properties-file <workload>.properties --config cdm-rs-pins.properties
#
# This file exists so that the asymmetry has one place to live. The workload `.properties` files
# are given to both implementations unchanged; everything here is given to cdm-rs alone, because
# Java has no property to give it to. That makes this the file to read first if you suspect the
# comparison was rigged: any advantage cdm-rs was handed and Java was not has to be in here.
#
# Its key set is disjoint from the workload files (canonical cdm-rs names, no `spark.cdm.*`
# aliases), so the loader's precedence between `--config` and `--properties-file` cannot matter.
#
# Rule applied throughout: where Java has no knob, pin cdm-rs to the value that makes it do the
# same amount of work Java does, or — where no such value exists — to cdm-rs's own default, and
# say so in ../METHODOLOGY.md §5 rather than tuning it.
#
# Do NOT add `--strict-config` to the cdm-rs invocation. The workload files carry
# `spark.cdm.perfops.errorLimit`, which Java ignores and cdm-rs implements; under `--strict-config`
# an unknown key would be an error rather than a warning, and the day a Java-only key is added to
# the shared file the cdm-rs run would fail instead of warning.

# --- parallelism -------------------------------------------------------------------------------
# 4 range workers against `spark-submit --master local[4]`. The mapping is by OS threads, not by
# logical unit: a Spark task is a synchronous per-partition loop on one of four executor threads,
# a cdm-rs worker is an async task on a four-thread Tokio runtime. Neither is the other, and §5.1
# argues why matching threads is the least wrong choice available.
perfops.workers                         4

# cdm-rs's own defaults, unchanged. Java has no equivalent of either: its in-flight write depth is
# bounded only by the size of a token range, because its flush threshold is unreachable
# (MIGRATION_FROM_JAVA item 15). At batchSize 1 and a fetch size of 1,000 cdm-rs's MIG-004 flush
# threshold works out to 100, so its effective write depth is ~100 per worker — about 400 in all,
# well under this cap, which therefore never binds. Java's is up to 2,000. That asymmetry favours
# Java on throughput and costs it memory; it is not fixable from configuration. See §5.2.
perfops.max_inflight_writes             2000
perfops.max_inflight_reads              256
perfops.connection_pool_size            4

# --- planning ----------------------------------------------------------------------------------
# `fixed` is Java CDM's splitter reproduced exactly (TOK-003) and is the only `[P]` strategy.
# `ring_aware` and `adaptive` are cdm-rs inventions; using either would mean the two runs did not
# divide the same ring the same way, and the row counts per range would stop matching.
plan.strategy                           fixed
plan.max_rows_per_range                 1000000

# --- write path --------------------------------------------------------------------------------
# `legacy` is Java's index-order batching. At the workload files' batchSize of 1 this is a no-op —
# a batch of one row has nothing to group — and it is pinned anyway so that configuration B
# (batchSize 5, §4.2) needs no second pins file and no second decision.
perfops.batch_grouping                  legacy

# cdm-rs retries a failed request five times with exponential backoff; Java uses the Java driver's
# retry policy. These are not the same policy and cannot be made the same. Left at cdm-rs's default
# and declared unmatched (§5.3). A measurement in which either implementation retried at all is
# void: the run was overload-bound, not throughput-bound.
perfops.retry.max_attempts              5
perfops.retry.initial_backoff           100ms
perfops.retry.max_backoff               10s
perfops.request_timeout                 30s

# --- everything cdm-rs can do that Java cannot, switched off -----------------------------------
# ENG-006's AIMD controller has no Java counterpart. On, it would change the write rate mid-run in
# response to the target, which is a different experiment.
perfops.adaptive_ratelimit              false

# CON-010. Off is the default; a speculative execution is a second copy of a request, and Java
# issues none.
connect.origin.speculative.enabled      false
connect.target.speculative.enabled      false

# VAL-015 keys-only validation has no Java equivalent and skips almost all of validate's work. Any
# validate comparison run with this on would be measuring two different jobs.
validate.keys_only                      false
# VAL-013's machine-readable report is extra work Java never does.
validate.report.format                  none

# DST-001 lease coordination, the SEC-010 control plane, MET-020 Prometheus and MET-030 events all
# have no Java counterpart and all cost something. Off.
cluster.enabled                         false
server.enabled                          false
metrics.prometheus.enabled              false
metrics.events.sink                     none

# GRD-004's inline guardrail mode. `check` is the default and, with the shared
# `feature.guardrail.colSizeInKB = 0`, the guardrail does not run at all — matching Java, where it
# is a separate job and cannot run inside a migration.
feature.guardrail.mode                  check

# --- logging -----------------------------------------------------------------------------------
# INFO on both sides, not WARN: Java's final counter block (MET-005, MET-006) is logged at INFO,
# and that block is what the harness parses for the row counts. Java's log4j2 must be configured
# to the same level and both logs redirected to a file on the same filesystem. §7.4 requires the
# two logs' line counts to be recorded, so that "one tool was writing ten times as much to the
# console" is visible rather than assumed away.
logging.level                           info
logging.format                          compact
