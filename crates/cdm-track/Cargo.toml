[package]
name = "cdm-track"
description = "Run tracking, resume and rerun behind the pluggable `TrackingStore` trait."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# `cdm-engine` is a dependency and not the other way round: the engine's seam into tracking is the
# `RangeObserver` trait, which this crate implements, so nothing in `cdm-engine` names `cdm-track`
# and the graph stays acyclic. Depending on it here is what lets `TRK-033` reuse the Java-parity
# splitter of `TOK-003` instead of transcribing that arithmetic a second time.
#
# `scylla` appears here for the one reason `ARCHITECTURE.md` §3 otherwise forbids: the tracking
# tables live in the *target* keyspace and are written through `cdm-cql`'s target session, which
# is handed out as an `Arc<scylla::client::session::Session>` and has no statement facade yet.
# See the module note on `store::cassandra` for what would remove it again.
[dependencies]
async-trait.workspace = true
cdm-config.workspace = true
cdm-core.workspace = true
cdm-cql.workspace = true
cdm-engine.workspace = true
cdm-metrics.workspace = true
chrono.workspace = true
parking_lot.workspace = true
scylla.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
tracing.workspace = true

# The resume suite drives the real migrate job against a real node, so it needs the codec planner
# the job's conversion plans are built from. A *dev*-dependency is outside the production graph
# `ARCHITECTURE.md` §3 governs, which is the same reason `cdm-engine` dev-depends on `scylla`.
[dev-dependencies]
cdm-codec.workspace = true
cdm-testkit.workspace = true
# `proptest` is the workspace's property-testing crate; `TST-041`'s coverage invariant has to hold
# for *every* interruption point, which is a property rather than a case.
proptest.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
