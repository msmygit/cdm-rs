[package]
name = "cdm-metrics"
description = "Counter registry, instruments, event bus and exporters (Prometheus, OTLP, NDJSON, TUI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# The terminal UI (`MET-031`, PR #39) is the only part of this crate's remit still missing, and
# `ratatui` arrives with it. Everything else here is deliberately transport-free: the Prometheus
# text and the OTLP payloads are *rendered*, and putting them on a socket is the job of a crate
# that is allowed to depend on an HTTP client (`ARCHITECTURE.md` §3).
[dependencies]
async-trait.workspace = true
cdm-core.workspace = true
chrono.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
