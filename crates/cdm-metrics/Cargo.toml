[package]
name = "cdm-metrics"
description = "Counter registry, instruments, event bus and exporters (Prometheus, OTLP, NDJSON, TUI)."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# `cargo bench` would otherwise also run this target's libtest harness, which rejects criterion's
# `--output-format bencher` and fails the whole workspace bench run before a single benchmark
# executes (TST-060). Only `benches/` targets are benchmarks here.
[lib]
bench = false

# Deliberately transport-free, and now also deliberately terminal-free: the Prometheus text and the
# OTLP payloads are *rendered*, and putting them on a socket is the job of a crate that is allowed
# to depend on an HTTP client (`ARCHITECTURE.md` §3). `MET-031`'s view model (`dashboard`) follows
# the same rule — it is the state a live display needs, with no notion of a screen — so `ratatui`
# is a `cdm-cli` dependency and never one of this crate's.
[dependencies]
async-trait.workspace = true
cdm-core.workspace = true
chrono.workspace = true
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["sync"] }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
insta.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "sync", "time"] }
