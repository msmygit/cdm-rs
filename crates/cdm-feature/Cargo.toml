[package]
name = "cdm-feature"
description = "Optional behaviours as plugins: constant columns, explode map, extract JSON, TTL/writetime, filters, guardrails."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# ARCHITECTURE §3 puts `cdm-feature` above `cdm-codec`, `cdm-core` and `cdm-cql`. Nothing here
# needs a session: every feature is expressed against the driver-independent `CqlTypeInfo`,
# `RawCell` and `Record`, which is what makes the "independently unit-testable without a cluster"
# clause of SPEC §11 structural rather than aspirational — so the `cdm-cql` edge is deliberately
# not taken until a feature genuinely needs the driver.
[dependencies]
bigdecimal.workspace = true
cdm-codec.workspace = true
cdm-core.workspace = true
chrono.workspace = true
num-bigint.workspace = true
regex.workspace = true
serde_json.workspace = true
tracing.workspace = true
uuid.workspace = true

# `TST-010` wants property tests over *generated schemas* for the guardrail's size accounting.
# `proptest` is already the workspace's property-testing crate (`cdm-engine` dev-depends on it), so
# this adds no new licence, advisory or supply-chain surface for `cargo deny` to weigh.
[dev-dependencies]
criterion.workspace = true
proptest.workspace = true

# `harness = false` hands `cargo bench` to criterion's own runner instead of libtest's, which is
# what gives us the statistics and the `--output-format bencher` that `bench.yml` consumes.
[[bench]]
name = "pipeline"
harness = false
