[package]
name = "cdm-testkit"
description = "Test fixtures: containers, schema/data generators, counter assertions, mock sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# `cargo bench` would otherwise also run this target's libtest harness, which rejects criterion's
# `--output-format bencher` and fails the whole workspace bench run before a single benchmark
# executes (TST-060). Only `benches/` targets are benchmarks here.
[lib]
bench = false

# `macrobench` is off by default, and that is the whole design (TST-060, NFR-004).
#
# The tier-2 macro-benchmark has to drive the *real* migrate job, or it measures something other
# than the product and is worthless. That needs `cdm-engine`, `cdm-cql` and `cdm-config`, which is
# the exact edge `ARCHITECTURE.md` §3 forbids this crate: `cdm-cql` and `cdm-engine` both
# dev-depend on `cdm-testkit`, so an unconditional edge would put the driver and the scheduler
# underneath every crate's test build.
#
# Behind an off-by-default feature it does not. The default dependency graph of `cdm-testkit` is
# byte-for-byte what it was, so nothing any other crate builds changes; only a caller that asks
# for `--features macrobench` — `cargo xtask bench`, and the suite in `tests/macrobench.rs` —
# resolves the extra edges. Cargo permits the resulting dev-dependency cycle (it is a cycle only
# through a dev-dependency, which is not part of any crate's own build), and
# `cargo check --workspace --all-targets --all-features` proves it.
#
# See `ARCHITECTURE.md` §3.3.
#
# `differential` is the sibling of `macrobench`, off for the same reason and on the same terms
# (TST-020). Two things are behind it, and only one of them needs the driver:
#
# * the **corpus** emits CQL *statements* and is driver-free — but it is a large generated
#   artefact (every CQL type, nesting depth 3, nulls, empty collections, edge-case values) whose
#   only consumers are `cargo xtask differential` and `tests/differential/`. Every other crate's
#   test build would compile it and never call it.
# * the **comparison engine** is driver-free too for the snapshot types, the byte comparison and
#   both counter-block comparisons — but it has to read each target keyspace back as raw bytes,
#   which is a `cdm-cql` job. Only `snapshot_target` is gated on that.
#
# So the default dependency graph of this crate is again byte-for-byte unchanged.
#
# `ARCHITECTURE.md` §3.3 named `macrobench.rs` as the only file behind an optional edge; §3.3.1
# now records this one beside it.
[features]
macrobench = ["dep:cdm-config", "dep:cdm-cql", "dep:cdm-engine"]
differential = ["dep:cdm-cql"]

[dependencies]
# Deliberately no `scylla` and no `cdm-cql`: only `cdm-cql` may depend on the driver
# (AGENTS.md, ARCHITECTURE.md §3), so the container fixture speaks to a node over a
# hand-rolled CQL `OPTIONS` probe and hands callers a contact point, and everything that
# needs a real session goes through the `TestSession` seam.
cdm-codec.workspace = true
cdm-core.workspace = true
cdm-metrics.workspace = true

# Only under `macrobench`; see the note above the `[features]` table.
cdm-config = { workspace = true, optional = true }
cdm-cql = { workspace = true, optional = true }
cdm-engine = { workspace = true, optional = true }

async-trait.workspace = true
chrono.workspace = true
rand.workspace = true
testcontainers.workspace = true
tokio.workspace = true
uuid.workspace = true

# The SIT parity suite (`TST-003`) renders each case's `.properties` template into a scratch
# directory and hands the path to the `cdm` binary. Nothing is written to a fixed path: a suite
# that wrote to `/tmp` by name would not run on Windows, which has broken this repository's CI
# before.
[dev-dependencies]
tempfile.workspace = true
