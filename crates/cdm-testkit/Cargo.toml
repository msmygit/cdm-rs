[package]
name = "cdm-testkit"
description = "Test fixtures: containers, schema/data generators, counter assertions, mock sessions."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[dependencies]
# Deliberately no `scylla` and no `cdm-cql`: only `cdm-cql` may depend on the driver
# (AGENTS.md, ARCHITECTURE.md §3), so the container fixture speaks to a node over a
# hand-rolled CQL `OPTIONS` probe and hands callers a contact point, and everything that
# needs a real session goes through the `TestSession` seam.
cdm-codec.workspace = true
cdm-core.workspace = true
cdm-metrics.workspace = true

async-trait.workspace = true
chrono.workspace = true
rand.workspace = true
testcontainers.workspace = true
tokio.workspace = true
uuid.workspace = true

# The SIT parity suite (`TST-003`) renders each case's `.properties` template into a scratch
# directory and hands the path to the `cdm` binary. Nothing is written to a fixed path: a suite
# that wrote to `/tmp` by name would not run on Windows, which has broken this repository's CI
# before.
[dev-dependencies]
tempfile.workspace = true
