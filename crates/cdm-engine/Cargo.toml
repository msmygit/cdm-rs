[package]
name = "cdm-engine"
description = "Scheduler, rate limiting, backpressure, failure isolation and the built-in jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# ARCHITECTURE §3: the planner and the scheduler need only `cdm-config`, `cdm-core` and
# `cdm-metrics` — the cluster facts the planner uses arrive through the `planner::ClusterTopology`
# trait, exactly as `cdm-config` takes a `SchemaProvider`, and everything the scheduler asks of a
# cluster it asks through the `scheduler::RangeProcessor` trait. The *jobs* in `jobs::*` need more:
# `cdm-codec` for the conversion a comparison runs, `cdm-cql` for the schemas and the statements,
# and `cdm-feature` for the filters and the extract-JSON plan. All three edges are in the graph in
# `docs/ARCHITECTURE.md` §3.
[dependencies]
async-trait.workspace = true
cdm-codec.workspace = true
cdm-config.workspace = true
cdm-core.workspace = true
cdm-cql.workspace = true
cdm-feature.workspace = true
cdm-metrics.workspace = true
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
# `VAL-013`'s discrepancy report is JSON and NDJSON, so the serialiser is a production
# dependency of this crate rather than a test one.
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

# The integration suite drives each job against a real node. `cdm-cql` is the only crate that may
# depend on `scylla` (`ARCHITECTURE.md` §3); a *dev*-dependency here is outside the production
# graph that rule governs, and is what lets `guardrail_it.rs` read frame bytes directly in order to
# state, independently of the job, what the job should have measured.
[dev-dependencies]
# `cdm-testkit` is a dev-dependency in this direction only: the testkit must not depend on the
# engine (ARCHITECTURE.md §3), and the `*_it` suites are where each job meets a real node.
cdm-testkit.workspace = true

criterion.workspace = true
proptest.workspace = true
scylla.workspace = true
tempfile.workspace = true
# `test-util` is what makes the rate-limit and shutdown tests deterministic: it pauses the
# runtime clock so elapsed time is a function of the program, not of the CI machine's load.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }

# `harness = false` hands `cargo bench` to criterion's own runner instead of libtest's, which is
# what gives us the statistics and the `--output-format bencher` that `bench.yml` consumes.
[[bench]]
name = "compare"
harness = false
