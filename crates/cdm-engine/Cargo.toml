# ARCHITECTURE §3: `cdm-engine` depends on `cdm-config` and `cdm-core` for the planner. It does
# *not* need `cdm-cql` for it — the cluster facts the planner uses arrive through the
# `planner::ClusterTopology` trait, exactly as `cdm-config` takes a `SchemaProvider`.
