[package]
name = "cdm-engine"
description = "Scheduler, rate limiting, backpressure, failure isolation and the built-in jobs."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# ARCHITECTURE §3: the planner and the scheduler need only `cdm-config`, `cdm-core` and
# `cdm-metrics` — the cluster facts the planner uses arrive through the `planner::ClusterTopology`
# trait, exactly as `cdm-config` takes a `SchemaProvider`, and everything the scheduler asks of a
# cluster it asks through the `scheduler::RangeProcessor` trait. The *jobs* in `jobs::*` need more:
# `cdm-codec` for the conversion a comparison runs, `cdm-cql` for the schemas and the statements,
# and `cdm-feature` for the filters and the extract-JSON plan. All three edges are in the graph in
# `docs/ARCHITECTURE.md` §3.
[dependencies]
async-trait.workspace = true
cdm-codec.workspace = true
cdm-config.workspace = true
cdm-core.workspace = true
cdm-cql.workspace = true
cdm-feature.workspace = true
cdm-metrics.workspace = true
chrono.workspace = true
futures.workspace = true
parking_lot.workspace = true
serde.workspace = true
tokio = { workspace = true, features = ["macros", "rt", "signal", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
cdm-testkit.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# `test-util` is what makes the rate-limit and shutdown tests deterministic: it pauses the
# runtime clock so elapsed time is a function of the program, not of the CI machine's load.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
