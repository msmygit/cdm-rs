[package]
name = "cdm-config"
description = "The single typed configuration model, its loaders, and three-tier validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# `humantime-serde` is reached only through `#[serde(with = "humantime_serde")]`, a string
# literal that cargo-machete's source scan cannot see. Removing it breaks the build.
[package.metadata.cargo-machete]
ignored = ["humantime-serde"]

# ARCHITECTURE §3.2: `cdm-config` depends on `cdm-core` and nothing else in the workspace. In
# particular it must NOT depend on `cdm-cql` — Tier-3 (schema-bound) validation is expressed as
# the `SchemaProvider` trait defined here and implemented there.
#
# There is no `thiserror`: every failure in this crate is a `cdm_core::Diagnostic`, because
# `CFG-021` requires every violation to be reported at once rather than as one returned error.
[dependencies]
cdm-core.workspace = true
chrono-tz.workspace = true
humantime-serde.workspace = true
num_cpus.workspace = true
regex.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
strsim.workspace = true
toml.workspace = true
uuid.workspace = true
zeroize.workspace = true

[dev-dependencies]
# `proptest` is the workspace's property-testing crate; `TST-010`'s configuration round-trip is
# the one property that has to be expressed over the whole registry at once.
proptest.workspace = true
tempfile.workspace = true
