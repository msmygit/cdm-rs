[package]
name = "cdm-cli"
description = "The `cdm` binary: argument parsing, output rendering, exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "cdm"
path = "src/main.rs"

# The CLI is the first caller that assembles a whole run, so it takes an edge to every layer the
# run passes through: `cdm-cql` for the sessions and statements, `cdm-codec` for the conversion
# plan, `cdm-engine` for the planner, scheduler and jobs, and `cdm-metrics` for the counter block.
# `ARCHITECTURE.md` §3 has all four edges; none of them is `scylla`, which stays behind `cdm-cql`.
#
# No `cdm-feature` edge: the guardrail is the one job this harness does not build, so taking the
# dependency now would be a claim about a wiring that does not exist.
[dependencies]
cdm-codec.workspace = true
cdm-config.workspace = true
cdm-core.workspace = true
cdm-cql.workspace = true
cdm-engine.workspace = true
cdm-metrics.workspace = true
clap.workspace = true
clap_complete.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal"] }
toml.workspace = true

[dev-dependencies]
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
cdm-core.workspace = true
