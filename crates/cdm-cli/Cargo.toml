[package]
name = "cdm-cli"
description = "The `cdm` binary: argument parsing, output rendering, exit codes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# `cargo bench` would otherwise also run this target's libtest harness, which rejects criterion's
# `--output-format bencher` and fails the whole workspace bench run before a single benchmark
# executes (TST-060). Only `benches/` targets are benchmarks here.
[lib]
bench = false

[[bin]]
name = "cdm"
path = "src/main.rs"
bench = false

# The CLI is the first caller that assembles a whole run, so it takes an edge to every layer the
# run passes through: `cdm-cql` for the sessions and statements, `cdm-codec` for the conversion
# plan, `cdm-engine` for the planner, scheduler and jobs, and `cdm-metrics` for the counter block.
# `ARCHITECTURE.md` §3 has all four edges; none of them is `scylla`, which stays behind `cdm-cql`.
#
# The `cdm-feature` edge is the fifth, and it is what turns a validated `feature.*` block into the
# plans the jobs take: the constants and explode map a `ColumnMapping` needs, the TTL/writetime
# plan a migrate run's `USING` clause needs, the filters, and the guardrail. Until it existed the
# harness built every job with `::default()` and discarded the configuration it had just validated.
[dependencies]
cdm-codec.workspace = true
cdm-config.workspace = true
cdm-core.workspace = true
cdm-cql.workspace = true
cdm-engine.workspace = true
cdm-feature.workspace = true
cdm-metrics.workspace = true
cdm-track.workspace = true
chrono.workspace = true
clap.workspace = true
clap_complete.workspace = true
crossterm.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
toml.workspace = true

[dev-dependencies]
async-trait.workspace = true
pretty_assertions.workspace = true
serde_json.workspace = true
tempfile.workspace = true
cdm-core.workspace = true
