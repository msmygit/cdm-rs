[package]
name = "cdm-core"
description = "Domain vocabulary, error model, diagnostics and the plugin registry. Zero I/O."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# Zero I/O (ARCHITECTURE §3.2): no driver, no HTTP client/server, no async runtime, no
# filesystem access. `async-trait` only shapes trait signatures; it pulls in no executor.
[dependencies]
async-trait.workspace = true
bytes.workspace = true
chrono.workspace = true
schemars.workspace = true
serde.workspace = true
thiserror.workspace = true

# `serde_json` proves the serde representations that `cdm-api` and the tracking store depend on.
[dev-dependencies]
criterion.workspace = true
serde_json.workspace = true

# `harness = false` hands `cargo bench` to criterion's own runner instead of libtest's, which is
# what gives us the statistics and the `--output-format bencher` that `bench.yml` consumes.
[[bench]]
name = "token"
harness = false
