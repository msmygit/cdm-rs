[package]
name = "cdm-cql"
description = "Driver layer: connections, TLS/Astra, schema introspection, statements. The only crate that depends on `scylla`."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

# `cargo bench` would otherwise also run this target's libtest harness, which rejects criterion's
# `--output-format bencher` and fails the whole workspace bench run before a single benchmark
# executes (TST-060). Only `benches/` targets are benchmarks here.
[lib]
bench = false

[dependencies]
cdm-codec.workspace = true
cdm-config.workspace = true
cdm-core.workspace = true
scylla.workspace = true
async-trait.workspace = true
p12-keystore.workspace = true
rand.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha1.workspace = true
tokio.workspace = true
tokio-rustls.workspace = true
tracing.workspace = true
uuid.workspace = true
webpki-roots.workspace = true
zip.workspace = true

[dev-dependencies]
# `cdm-testkit` is a dev-dependency here and nowhere in the other direction: the testkit must not
# depend on the driver (ARCHITECTURE.md §3), so this crate is where its session seam gets its
# first real implementation and its container fixture gets exercised end to end (TST-100).
cdm-testkit.workspace = true

anyhow.workspace = true
criterion.workspace = true
futures.workspace = true
# `proptest` is the workspace's property-testing crate (`cdm-codec`, `cdm-engine` and
# `cdm-feature` all dev-depend on it); `TST-010`'s `MIG-012` property lives beside the binder.
proptest.workspace = true
rcgen.workspace = true
tempfile.workspace = true
testcontainers.workspace = true
# `test-util` pauses the runtime clock, so the retry-backoff fault tests are a function of the
# program rather than of the CI machine's load (`TST-040`).
tokio = { workspace = true, features = ["test-util"] }

# `harness = false` hands `cargo bench` to criterion's own runner instead of libtest's, which is
# what gives us the statistics and the `--output-format bencher` that `bench.yml` consumes.
[[bench]]
name = "bind"
harness = false
