[package]
name = "xtask"
description = "Repository automation: traceability checks, artefact generation, test orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

# See the note in every crate's Cargo.toml: libtest harnesses reject criterion's
# `--output-format bencher` and would fail the workspace bench run (TST-060).
[[bin]]
name = "xtask"
path = "src/main.rs"
bench = false

[dependencies]
anyhow.workspace = true
cdm-config.workspace = true
# `cargo xtask it` must decide whether a container runtime is available using exactly the rule the
# tests themselves use, or the two disagree and TST-102's "skip, do not fail" becomes a lie.
#
# `macrobench` is what makes `cargo xtask bench` possible: the harness is off by default so that
# `cdm-engine`/`cdm-cql`/`cdm-config` stay out of every other crate's test build, and xtask is the
# one consumer that opts in (see the note above `[features]` in cdm-testkit, and ARCHITECTURE §3.3).
cdm-testkit = { workspace = true, features = ["macrobench"] }
clap.workspace = true
regex.workspace = true
serde_yaml.workspace = true
# `cargo xtask bench` drives the async macro-benchmark harness, so xtask owns the runtime it runs
# on: the harness is a library function, not a test, and has no runtime of its own (TST-060).
tokio.workspace = true
