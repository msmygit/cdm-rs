[package]
name = "xtask"
description = "Repository automation: traceability checks, artefact generation, test orchestration."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
publish = false

[lints]
workspace = true

# See the note in every crate's Cargo.toml: libtest harnesses reject criterion's
# `--output-format bencher` and would fail the workspace bench run (TST-060).
[[bin]]
name = "xtask"
path = "src/main.rs"
bench = false

[dependencies]
anyhow.workspace = true
cdm-config.workspace = true
# `cargo xtask it` must decide whether a container runtime is available using exactly the rule the
# tests themselves use, or the two disagree and TST-102's "skip, do not fail" becomes a lie.
cdm-testkit.workspace = true
clap.workspace = true
regex.workspace = true
serde_yaml.workspace = true
# `cargo xtask bench` drives the async macro-benchmark harness, so xtask owns the runtime it runs
# on: the harness is a library function, not a test, and has no runtime of its own (TST-060).
tokio.workspace = true
