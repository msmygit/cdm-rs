# Changelog generation from Conventional Commits (OPS-020).
[changelog]
header = "# Changelog\n\nAll notable changes to cdm-rs. Generated from Conventional Commits.\n"
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}{% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {{ commit.message | upper_first }}{% if commit.footers %}{% for f in commit.footers %}{% if f.token == "Implements" %} (`{{ f.value }}`){% endif %}{% endfor %}{% endif %}
{%- endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Testing" },
    { message = "^refactor", group = "Refactoring" },
    { message = "^(build|ci|chore)", group = "Maintenance" },
]
