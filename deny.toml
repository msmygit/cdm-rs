# Supply-chain policy (SEC-030). Enforced by `cargo deny check` in pre-commit and CI.

[graph]
all-features = true

[advisories]
version = 2
yanked = "deny"
ignore = []

[licenses]
version = 2
# Apache-2.0 project: permissive licences only, no copyleft.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    # webpki-roots ships the Mozilla CA certificate store. CDLA-Permissive-2.0 is a data licence
    # covering that certificate set, not code, and it places no restriction on distributing the
    # binary. A TLS client needs a root store; refusing this licence would mean shipping without one.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # Use rustls throughout; no OpenSSL in the dependency tree.
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
