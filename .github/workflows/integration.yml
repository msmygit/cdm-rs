name: Integration

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Nightly adds ScyllaDB, which the per-PR matrix omits (TST-002, ADR-0002).
    - cron: "0 3 * * *"
  workflow_dispatch:

concurrency:
  group: integration-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    name: ${{ matrix.engine }} ${{ matrix.version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # TST-002: Cassandra is the risk surface and runs on every PR. ScyllaDB is the
        # driver's home turf and runs nightly — claimed support must still be exercised.
        engine:
          - cassandra:3.11
          #- cassandra:4.0
          - cassandra:4.1
          - cassandra:5.0
        include:
          - engine: scylladb/scylla:6.2
            nightly_only: true
    steps:
      - uses: actions/checkout@v7
        if: ${{ !matrix.nightly_only || github.event_name != 'pull_request' }}
      - uses: dtolnay/rust-toolchain@stable
        if: ${{ !matrix.nightly_only || github.event_name != 'pull_request' }}
      - uses: Swatinem/rust-cache@v2
        if: ${{ !matrix.nightly_only || github.event_name != 'pull_request' }}
      - name: Run integration suite
        if: ${{ !matrix.nightly_only || github.event_name != 'pull_request' }}
        env:
          CDM_IT_ENGINES: ${{ matrix.engine }}
        run: cargo test --workspace --all-features -- --ignored --test-threads=1
