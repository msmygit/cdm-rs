name: Differential vs Java CDM

# NOTE: the differential harness is delivered by PR #34. Restore the nightly schedule then.
on:
  workflow_dispatch:

jobs:
  differential:
    # TST-020: run both implementations over the same seeded corpus and assert
    # byte-identical target state and identical counter blocks.
    name: Java/Rust differential suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5.6.0
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask differential
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: differential-report
          path: reports/differential/
