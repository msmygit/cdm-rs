name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  audit:
    name: cargo audit / deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-audit,cargo-deny
      # Fail on vulnerabilities. Deliberately NOT `--deny warnings`: that also fails on
      # `unmaintained` and `unsound` notices for transitive dependencies, which can appear
      # overnight through no change of ours and would block every PR. Those categories are
      # handled by `cargo deny check advisories`, which has a reviewable ignore list.
      - run: cargo audit
      - run: cargo deny check

  secrets:
    name: Secret scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: rust
      - uses: github/codeql-action/analyze@v4

  sbom:
    name: SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2.85.13
        with:
          tool: cargo-cyclonedx
      - run: cargo cyclonedx --format json --all
      - uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: "**/*.cdx.json"
