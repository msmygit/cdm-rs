name: OpenAPI

on:
  pull_request:
    paths:
      - "crates/**"
      - "api/**"
      - "schema/**"
  workflow_dispatch:

jobs:
  contract:
    name: Spec generation, lint and breaking-change gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # API-002 / OPS-012: the checked-in document must equal freshly generated output.
      - name: Regenerate and diff
        run: cargo xtask openapi --check

      - name: Validate against the OpenAPI 3.1 meta-schema
        uses: char0n/swagger-editor-validate@v1
        with:
          definition-file: api/openapi.yaml

      # API-008: breaking changes require an explicit version bump.
      - name: Breaking-change gate
        run: |
          git show origin/${{ github.base_ref }}:api/openapi.yaml > /tmp/base-openapi.yaml || exit 0
          docker run --rm -v "$PWD:/w" -v /tmp:/tmp tufin/oasdiff breaking \
            /tmp/base-openapi.yaml /w/api/openapi.yaml --fail-on ERR
